server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx rejects an oversized declared body before the request reaches the
    # application. Preserve the API's content-free JSON failure contract rather
    # than returning the default HTML error document.
    error_page 413 = @request_body_too_large;
    location @request_body_too_large {
        internal;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=(), payment=(), usb=()" always;
        return 413 '{"detail":"File too large or request body exceeds the local processing limit."}';
    }

    # Portable backups have a separately bounded 128 MiB archive contract plus
    # multipart framing. No other endpoint inherits this larger receive limit.
    location = /api/v1/portability/inspect {
        client_max_body_size 129m;
        include /etc/nginx/conf.d/careeros-api-proxy.inc;
    }

    location = /api/v1/portability/restore {
        client_max_body_size 129m;
        include /etc/nginx/conf.d/careeros-api-proxy.inc;
    }

    # Proxy API requests to the backend — same-origin from browser's perspective,
    # which fixes both CORS and SameSite cookie issues.
    location /api/ {
        client_max_body_size 11m;
        include /etc/nginx/conf.d/careeros-api-proxy.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # The SPA shell and unhashed public assets must be revalidated on every
        # rollout so they cannot retain references to deleted hashed chunks.
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # The current-location control is the only browser capability in use and
        # is never delegated away from this same-origin document.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), display-capture=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
    }

    # Vite fingerprints build artifacts with a final dash-delimited hash.
    # Only those immutable URLs receive a one-year cache lifetime.
    location ~* "^/assets/.+-[a-z0-9_-]{8,}\.(?:css|js|mjs|woff2?|svg|png|jpe?g|webp|avif)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fail closed if a future build emits an unhashed file below /assets/.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

}
