worker_processes auto;
pid /tmp/nginx.pid;
# Request-level upstream errors include the private URI in Nginx's standard
# message. Health checks expose availability; retain only critical startup and
# worker failures on stderr.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Paths contain private profile, resume and application identifiers. Keep
    # operational request evidence without persisting address or target data.
    log_format privacy '$status $request_method $request_time';
    access_log /dev/stdout privacy;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/javascript;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    include /etc/nginx/conf.d/*.conf;
}
