name: careeros-local

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ollama:
    image: ollama/ollama:0.32.0@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    restart: unless-stopped
    init: true
    pids_limit: 512
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 15m
      OLLAMA_NO_CLOUD: "true"
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - model

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    pids_limit: 256
    stop_grace_period: 30s
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      OFFLINE_MODE: ${OFFLINE_MODE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: sqlite:////app/data/careeros.db
      DATA_DIR: /app/data
      LOCAL_INFERENCE_URL: http://ollama:11434
      LOCAL_INFERENCE_ALLOWED_HOSTS: ollama
      LOCAL_MODEL: ${LOCAL_MODEL:-qwen3:1.7b}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ALLOWED_HOSTS: '["localhost","127.0.0.1","backend","testserver"]'
    volumes:
      - app_data:/app/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - app
      - model
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    init: true
    pids_limit: 128
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  app_data:
    name: careeros-local-vault
  ollama_data:
    name: careeros-local-models

networks:
  app:
    name: careeros-local-app
  model:
    name: careeros-local-model
