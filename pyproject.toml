[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros-local"
version = "1.11.0"
description = "Open-source, local-first career utility for resumes, deterministic job search, and application tracking"
readme = "README.md"
authors = [
    { name = "Ejupi Labs" },
    { name = "CareerOS Local contributors" },
]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.12,<3.14"
keywords = ["career", "local-first", "privacy", "cli", "mcp", "tauri", "fastapi", "react"]
dependencies = [
    "APScheduler==3.11.3",
    "Pillow==12.3.0",
    "PyJWT==2.13.0",
    "SQLAlchemy==2.0.51",
    "alembic==1.18.5",
    "bcrypt==5.0.0",
    "fastapi==0.140.7",
    "greenlet==3.5.4",
    "httpx[http2]==0.28.1",
    "mcp==1.28.1",
    "pydantic-settings==2.14.2",
    "pydantic==2.13.4",
    "pypdf==6.14.2",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "reportlab==4.5.1",
    "slowapi==0.1.10",
    "tenacity==9.1.4",
    "uvicorn==0.51.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

[project.scripts]
careeros = "backend.automation.cli:main"
careeros-mcp = "backend.automation.mcp_server:main"

[tool.setuptools.packages.find]
include = ["backend*", "desktop*"]

[tool.setuptools.package-data]
"backend.ai" = ["fixtures/*.json"]
"backend.data" = ["skill_taxonomy.json"]
"backend.inference" = ["model_catalog.json", "model_catalog.sha256"]
"backend.migrations" = ["alembic.ini", "script.py.mako"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "acceptance: artifact-level tests enabled by an explicit packaged binary or service",
    "live: marks tests that hit live external APIs (deselect with '-m \"not live\"')",
    "slow: marks tests as slow-running",
    "performance: opt-in repeatable performance acceptance tests",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"backend/migrations/versions/*.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false

# ── Per-module overrides ──────────────────────────────────────────────────────
# The remaining overrides are an explicit debt ledger, not package-wide
# exclusions. Files that type-check successfully stay covered by CI.

[[tool.mypy.overrides]]
module = [
    # Dynamic provider sessions and legacy SQLAlchemy projections
    "backend.providers.jobs.session",
    "backend.providers.jobs.adecco.client",
    "backend.providers.jobs.localdb.client",
    "backend.providers.jobs.swissdevjobs.transformer",
    # Pydantic validator compatibility helpers
    "backend.core.config",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    # Repositories use SQLAlchemy Column attribute assignment (ORM pattern)
    "backend.repositories.profile_repository",
    "backend.repositories.base",
    "backend.repositories.job_repository",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    # Historical Alembic revisions are immutable operational records.
    "backend.migrations.versions.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    # Services with pre-existing SQLAlchemy Column / Session|None type debt
    "backend.services.scheduler",
    "backend.services.profile_service",
    "backend.services.search.persistence",
    # Cross-capability mixins are validated through their concrete compositions.
    "backend.ai.runtime_policy",
    "backend.ai.planning",
    "backend.ai.profile_normalization",
    "backend.ai.job_normalization",
    "backend.ai.matching",
    "backend.ai.reranking",
    "backend.search.*",
]
ignore_errors = true
