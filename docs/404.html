<!doctype html>
<html lang="en">
  <head>

    <title>Page not found — CareerOS Local</title>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <nav class="nav container" aria-label="Primary navigation">
        <a
          class="brand"
          href="/careeros-local/"
          aria-label="CareerOS Local home"
        >
          <img
            class="brand__mark"
            src="/careeros-local/site/careeros-mark.svg"
            alt=""
            width="36"
            height="36"
          />
          <span>CareerOS <strong>Local</strong></span>
        </a>
        <div class="nav-links">
          <a href="/careeros-local/#product">Product</a>
          <a href="/careeros-local/#privacy">Privacy</a>

          class="nav-cta"
          href="https://github.com/ejupi-djenis30/careeros-local"
        >
          View source
        </a>
      </nav>
    </header>
    <main id="main-content">
      <section class="hero" aria-labelledby="not-found-title">
        <div class="hero-orb hero-orb-one" aria-hidden="true"></div>
        <div class="hero-orb hero-orb-two" aria-hidden="true"></div>
        <div class="container hero-grid">
          <div class="hero-copy">
            <p class="eyebrow"><span aria-hidden="true"></span> Error 404</p>
            <h1 id="not-found-title">
              This route is not part of
              <span>CareerOS Local.</span>
            </h1>
            <p class="hero-lead">
              The link may be outdated. Return to the product page or inspect
              the current source and releases on GitHub.
            </p>
            <div class="hero-actions">
              <a class="button button-primary" href="/careeros-local/">
                Return to CareerOS Local
              </a>
              <a
                class="button button-secondary"
                href="https://github.com/ejupi-djenis30/careeros-local/releases/latest"
              >
                Latest release
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>
