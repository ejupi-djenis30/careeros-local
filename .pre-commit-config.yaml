# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Legal texts are reproduced and verified byte-for-byte by the generator.
        exclude: ^THIRD_PARTY_NOTICES\.txt$
      - id: end-of-file-fixer
        # Preserve the exact bytes emitted by Tauri's schema generator.
        exclude: ^frontend/src-tauri/gen/schemas/(acl-manifests|desktop-schema|windows-schema)\.json$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements

  # Run Python checks in the activated hash-locked development environment,
  # so hook versions and import visibility match CI without separate tool installs.
  - repo: local
    hooks:
      - id: ruff
        name: Python Lint (Ruff)
        entry: python -m ruff check backend tests/backend scripts
        language: system
        files: ^(backend/|tests/backend/|scripts/|pyproject\.toml$|requirements-dev\.(txt|lock)$)
        pass_filenames: false
      - id: ruff-format
        name: Python Format (Ruff)
        entry: python -m ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: Python Types (mypy)
        entry: python -m mypy backend scripts --ignore-missing-imports --no-error-summary
        language: system
        files: ^(backend/|scripts/|pyproject\.toml$|requirements(-dev)?\.(txt|lock)$)
        pass_filenames: false
      - id: frontend-lint
        name: Frontend Lint (ESLint)
        entry: python scripts/run_frontend_lint.py
        language: system
        files: ^(frontend/.*\.(js|jsx|ts|tsx|json)$|scripts/run_frontend_lint\.py$|\.nvmrc$)
        pass_filenames: false
