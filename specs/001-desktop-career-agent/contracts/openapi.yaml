openapi: 3.1.0
info:
  title: CareerOS Local Desktop Additions
  version: 1.4.0
  description: Local model, application workflow and recovery interfaces for feature 001.
servers:
  - url: http://127.0.0.1:{port}/api/v1
    variables:
      port:
        default: "8000"
security:
  - desktopSession: []
paths:
  /health/live:
    get:
      operationId: getBackendLiveness
      description: Pure asynchronous process liveness; performs no database, storage or worker wait.
      responses:
        "200":
          description: The backend event loop is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthLive" }
  /health/ready:
    get:
      operationId: getBackendReadiness
      description: Tries the vault reader gate without blocking, then joins bounded database, storage, migration and managed-runtime checks.
      responses:
        "200":
          description: The backend can accept normal vault work.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReady" }
        "503":
          description: Vault maintenance owns the writer gate or one readiness dependency is degraded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReady" }
  /auth/login:
    post:
      operationId: createLocalAccountSession
      description: Returns a normal access/refresh family only for a ready account; correct-password pending login returns maintenance-only access and session_state without a refresh cookie.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 1, maxLength: 50 }
                password:
                  type: string
                  minLength: 1
                  format: password
                  description: Must encode to at most 72 UTF-8 bytes; it is never truncated.
      responses:
        "200":
          description: Normal or purpose-bound pending-maintenance access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthToken" }
        "401":
          description: Username or password did not authenticate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
  /auth/refresh:
    post:
      operationId: rotateBrowserRefreshSession
      description: Atomically consumes the current refresh JTI. Reuse of an older token revokes its whole session family.
      security:
        - desktopSession: []
          refreshCookie: []
      responses:
        "200":
          description: A short-lived access token plus a Set-Cookie rotation for the same session family.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly path-scoped refresh JWT carrying a new one-time JTI.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthToken" }
        "401":
          description: The cookie is missing, malformed, expired, revoked, replayed or lacks server-side session state.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
  /auth/logout:
    post:
      operationId: revokeBrowserRefreshSession
      description: Revokes the signed refresh token's family, including when that token has already rotated, then clears canonical and legacy cookie paths.
      security:
        - desktopSession: []
      responses:
        "200":
          description: The supplied family was revoked when identifiable and all browser cookie variants were cleared.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
            Set-Cookie:
              schema: { type: string }
              description: Expired canonical and legacy refresh-cookie variants.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message]
                properties:
                  message: { const: Logged out successfully }
        "503":
          description: Session revocation rolled back; refresh cookies are cleared and the in-memory bearer may retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
  /career-profile:
    delete:
      operationId: resetCareerVault
      description: Persists reset_pending, quiesces owned work, revokes racing families and removes career-vault records while preserving the account.
      security:
        - desktopSession: []
          userAccessToken: []
      parameters:
        - in: header
          name: X-Confirm-Delete
          required: true
          schema: { const: DELETE-MY-CAREER-VAULT }
      responses:
        "204": { description: The career vault was reset and the durable lifecycle returned to ready. }
        "401":
          description: Session or maintenance authority is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
        "409":
          description: Confirmation is absent or another maintenance operation owns the account.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PrivateErrorResponse" }
                  - { $ref: "#/components/schemas/MaintenanceErrorResponse" }
        "500":
          description: Cleanup remains restart-recoverable under reset_pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceErrorResponse" }
  /portability/inspect:
    post:
      operationId: inspectPortableCareerVaultArchive
      description: Verifies archive structure, hashes, relationships and file bindings without mutating the local vault.
      security:
        - desktopSession: []
          userAccessToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary, maxLength: 134217728 }
      responses:
        "200":
          description: The archive was fully inspected and its compatibility and restore readiness are explicit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchiveInspection" }
        "401":
          description: Session authority is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
        "409":
          description: The vault is busy and inspection can be retried without side effects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceErrorResponse" }
        "413":
          description: The compressed archive exceeds 128 MiB.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PrivateErrorResponse" }
                  - { $ref: "#/components/schemas/MaintenanceErrorResponse" }
        "422":
          description: Archive structure, integrity, canonical identity, relationship or binding validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceErrorResponse" }
  /portability/restore:
    post:
      operationId: restorePortableCareerVault
      description: Restores an empty vault under durable same-fingerprint recovery; normal and maintenance-purpose access are accepted only in their matching state.
      security:
        - desktopSession: []
          userAccessToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary, maxLength: 134217728 }
      responses:
        "200":
          description: Restore committed, sessions and grants were revoked, and imported schedules are disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreResponse" }
        "401":
          description: Session or maintenance authority is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
        "409":
          description: The vault is non-empty, busy, owned by another maintenance operation or requires the original archive fingerprint.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PrivateErrorResponse" }
                  - { $ref: "#/components/schemas/MaintenanceErrorResponse" }
        "413":
          description: The compressed archive exceeds 128 MiB.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PrivateErrorResponse" }
                  - { $ref: "#/components/schemas/MaintenanceErrorResponse" }
        "422":
          description: Archive structure, integrity, canonical identity, relationship or binding validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
        "500":
          description: Cleanup is incomplete and restore_pending remains recoverable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceErrorResponse" }
        "507":
          description: Local storage could not durably publish or clean restore bytes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
  /portability/erase:
    delete:
      operationId: eraseCompleteLocalCareerData
      description: Persists or resumes erasure_pending and removes all account-owned vault, auth, staging and optional managed-runtime state.
      security:
        - desktopSession: []
          userAccessToken: []
      parameters:
        - in: header
          name: X-Confirm-Erase
          required: true
          schema: { const: ERASE-LOCAL-CAREER-DATA }
      responses:
        "200":
          description: Complete account-owned erasure converged.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer, minimum: 0 }
        "401":
          description: Maintenance authority is invalid or logged out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
        "409":
          description: Confirmation is absent or another maintenance operation completed first.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PrivateErrorResponse" }
                  - { $ref: "#/components/schemas/MaintenanceErrorResponse" }
        "500":
          description: Cleanup remains restart-recoverable under erasure_pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceErrorResponse" }
  /automation/grants:
    get:
      operationId: listAutomationGrants
      description: Lists every active owned grant followed by up to 100 inactive grants ordered by their revocation or expiry transition.
      security:
        - desktopSession: []
          userAccessToken: []
      responses:
        "200":
          description: Grant metadata only. Issued bearer tokens are never recoverable from this response.
          headers:
            Cache-Control: { schema: { const: "no-store, max-age=0" } }
            Pragma: { schema: { const: no-cache } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationGrant" }
        "401":
          description: The local user session is not authenticated.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
        "403":
          description: Desktop session authorization failed.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
        "500":
          description: The local access register could not be read.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
    post:
      operationId: createAutomationGrant
      description: Re-authenticates the local user and returns a scoped bearer token exactly once.
      security:
        - desktopSession: []
          userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationGrantIssue" }
      responses:
        "201":
          description: The grant metadata and its one-time bearer token.
          headers:
            Cache-Control: { schema: { const: "no-store, max-age=0" } }
            Pragma: { schema: { const: no-cache } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationGrantIssued" }
        "401":
          description: The local user session is not authenticated.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
        "403":
          description: The current CareerOS password did not match (`authentication_failed`), or desktop session authorization failed.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/AutomationErrorResponse" }
                  - { $ref: "#/components/schemas/PrivateErrorResponse" }
        "409":
          description: The account already has the maximum number of active grants (`active_grant_limit`).
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "422":
          description: A label, scope or lifetime bound is invalid.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/AutomationErrorResponse" }
                  - { $ref: "#/components/schemas/ValidationErrorResponse" }
        "429":
          description: Repeated failed password checks temporarily locked grant creation for this account.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "500":
          description: Grant creation failed unexpectedly.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
  /automation/grants/{grant_id}/revoke:
    post:
      operationId: revokeAutomationGrant
      description: Re-authenticates the owner and idempotently revokes one retained grant. Successful grant mutations keep only the owner's 100 most recent inactive rows.
      security:
        - desktopSession: []
          userAccessToken: []
      parameters:
        - name: grant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, format: password, writeOnly: true }
      responses:
        "200":
          description: Revoked grant metadata. Repeating the request returns the same row while it remains in the bounded recent-history retention window.
          headers:
            Cache-Control: { schema: { const: "no-store, max-age=0" } }
            Pragma: { schema: { const: no-cache } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationGrant" }
        "401":
          description: The local user session is not authenticated.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
        "403":
          description: The current CareerOS password did not match (`authentication_failed`), or desktop session authorization failed.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/AutomationErrorResponse" }
                  - { $ref: "#/components/schemas/PrivateErrorResponse" }
        "404":
          description: The grant does not belong to this account or has left the bounded recent-history retention window (`grant_not_found`).
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "422":
          description: The grant identifier or password payload is invalid.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "429":
          description: This failed password check activated issuance lockout. While locked, the authenticated desktop session may revoke an owned grant without inspecting any submitted password.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationErrorResponse" }
        "500":
          description: Revocation failed unexpectedly.
          headers:
            Cache-Control: { $ref: "#/components/headers/PrivateCacheControl" }
            Pragma: { $ref: "#/components/headers/PrivatePragma" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateErrorResponse" }
  /local-model/status:
    get:
      operationId: getLocalModelStatus
      responses:
        "200":
          description: Runtime, installation and evaluation readiness without sensitive paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalModelStatus"
  /local-model/catalog:
    get:
      operationId: getLocalModelCatalog
      responses:
        "200":
          description: Checked-in model choices safe for explicit local acquisition.
          content:
            application/json:
              schema:
                type: object
                required: [catalogVersion, models]
                properties:
                  catalogVersion: { type: string }
                  models:
                    type: array
                    items: { $ref: "#/components/schemas/ModelCatalogEntry" }
  /local-model/readiness:
    post:
      operationId: verifyLocalAnalysisReadiness
      description: Runs one content-free schema-constrained probe through the configured local model.
      security:
        - desktopSession: []
          userAccessToken: []
      responses:
        "200":
          description: Stable local-analysis readiness diagnostics; the response contains no prompt or model output.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalModelReadiness" }
        "401": { description: The local user session is not authenticated. }
  /applications/agenda:
    get:
      operationId: getApplicationAgenda
      description: Builds a deterministic private queue from owned scalar application projections.
      security:
        - desktopSession: []
          userAccessToken: []
      parameters:
        - name: local_day_end
          in: query
          required: true
          description: Timezone-aware instant of the browser's next local midnight, at most 26 hours after generation.
          schema: { type: string, format: date-time }
        - name: horizon_days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 30, default: 7 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: User-scoped agenda with explicit later and limit-truncation counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationAgendaResponse" }
        "401": { description: The local user session is not authenticated. }
        "422": { description: A query bound or persisted next-action projection is invalid. }
  /local-model/install:
    post:
      operationId: installLocalModel
      security:
        - desktopSession: []
          userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [modelKey, expectedCatalogVersion, consent]
              properties:
                modelKey: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{1,80}$" }
                expectedCatalogVersion: { type: string }
                consent: { const: true }
      responses:
        "202":
          description: Installation started or resumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalModelStatus" }
        "409": { description: Another installation or incompatible state is active. }
        "422": { description: Catalog choice, version or consent is invalid. }
  /local-model/cancel:
    post:
      operationId: cancelLocalModelInstall
      security:
        - desktopSession: []
          userAccessToken: []
      responses:
        "202": { description: Cancellation requested and partial files scheduled for removal. }
  /local-model/restart:
    post:
      operationId: restartLocalModel
      security:
        - desktopSession: []
          userAccessToken: []
      responses:
        "202": { description: A bounded local runtime restart was requested. }
        "409": { description: No verified model is installed. }
  /ai-evaluations:
    get:
      operationId: listLocalModelEvaluations
      security:
        - desktopSession: []
          userAccessToken: []
      responses:
        "200":
          description: Content-free aggregate evaluation history.
  /ai-evaluations/run:
    post:
      operationId: runLocalModelEvaluation
      security:
        - desktopSession: []
          userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: { type: string, enum: [offline, live] }
      responses:
        "202": { description: Offline evaluation accepted. }
        "409": { description: Model unavailable or evaluation already active. }
  /applications/{application_id}/readiness:
    get:
      operationId: getApplicationReadiness
      security:
        - desktopSession: []
          userAccessToken: []
      parameters:
        - name: application_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deterministic local preflight completeness report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationReadinessReport" }
        "404": { description: The application does not belong to the current user. }
  /applications/{application_id}/readiness/export:
    get:
      operationId: exportApplicationReadiness
      security:
        - desktopSession: []
          userAccessToken: []
      parameters:
        - name: application_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, markdown], default: json }
      responses:
        "200":
          description: Canonical report bytes; X-Content-SHA256 hashes the exact response body.
          headers:
            X-Content-SHA256:
              schema: { type: string, pattern: "^[a-f0-9]{64}$" }
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema: { type: string, format: binary }
            text/markdown:
              schema: { type: string, format: binary }
        "404": { description: The application does not belong to the current user. }
  /applications/{application_id}/preparation:
    patch:
      operationId: updateApplicationPreparation
      security:
        - desktopSession: []
          userAccessToken: []
      parameters:
        - name: application_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationPreparationUpdate" }
      responses:
        "200": { description: Revisioned application with a content-free preparation audit event. }
        "404": { description: The application does not belong to the current user. }
        "409": { description: The expected revision is stale. }
        "422": { description: A URL, email, resume link or update payload is invalid. }
  /applications/{application_id}/dossier-draft:
    parameters:
      - name: application_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getApplicationDossierDraft
      security:
        - desktopSession: []
          userAccessToken: []
      responses:
        "200":
          description: The owned SQLite-backed working draft, or null when no draft exists.
          headers:
            Cache-Control:
              schema: { const: "private, no-store" }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ApplicationDossierDraftResponse" }
                  - { type: "null" }
        "401": { description: The local user session is not authenticated. }
        "404": { description: The application does not belong to the current user. }
    put:
      operationId: putApplicationDossierDraft
      description: Creates or compare-and-swap updates one bounded working draft.
      security:
        - desktopSession: []
          userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationDossierDraftPut" }
      responses:
        "200":
          description: The stored draft with its next compare-and-swap revision.
          headers:
            Cache-Control:
              schema: { const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDossierDraftResponse" }
        "401": { description: The local user session is not authenticated. }
        "404": { description: The application does not belong to the current user. }
        "409":
          description: The application, linked resume or working draft revision is stale.
        "422": { description: The bounded draft payload is invalid. }
    delete:
      operationId: deleteApplicationDossierDraft
      security:
        - desktopSession: []
          userAccessToken: []
      parameters:
        - name: expected_revision
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: The exact saved draft revision was deleted. }
        "401": { description: The local user session is not authenticated. }
        "404": { description: The application or draft does not exist for the current user. }
        "409": { description: The working draft revision is stale. }
        "422": { description: The expected revision is invalid. }
  /applications/{application_id}/dossiers:
    post:
      operationId: publishApplicationDossier
      description: >
        Publishes directly when no working draft exists. If a draft exists, the request must name
        and exactly match its current revision; that row is consumed in the immutable event
        transaction.
      security:
        - desktopSession: []
          userAccessToken: []
      parameters:
        - name: application_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationDossierCreate" }
      responses:
        "201":
          description: The immutable dossier event and updated application revision.
        "401": { description: The local user session is not authenticated. }
        "404": { description: The application does not belong to the current user. }
        "409":
          description: The application or saved draft changed before publication.
        "422":
          description: Readiness, evidence, content or bounded artifact validation failed.
  /job-providers:
    get:
      operationId: listJobProviderConfigurations
      description: Lists installed providers and discoverable packs. A fresh Vault has no installed network providers; configured header values are always redacted.
      security:
        - desktopSession: []
          userAccessToken: []
      responses:
        "200":
          description: Provider registry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCatalog" }
    post:
      operationId: createJobProviderConfiguration
      description: Creates a bounded JSON or HTML provider declaration; enabling it is explicit network-source consent.
      security:
        - desktopSession: []
          userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderConfigurationInput" }
      responses:
        "201":
          description: Revisioned provider with confidential headers redacted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderConfiguration" }
        "409": { description: Provider key or per-account provider limit conflict. }
        "422": { description: Declaration, destination, mapping or bound is invalid. }
  /job-providers/import:
    post:
      operationId: importJobProviderDocument
      description: Atomically imports one strict data-only provider document or pack. Network access remains disabled unless activation is explicit.
      security:
        - desktopSession: []
          userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderImportRequest" }
      responses:
        "201":
          description: Every provider in the document was imported at revision one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderImportResult" }
        "409": { description: A provider key conflicts or the account provider limit would be exceeded; nothing was imported. }
        "413": { description: The normalized document exceeds 256 KiB. }
        "422": { description: The strict document, adapter reference, destination or mapping is invalid. }
  /job-providers/packs/{pack_id}/import:
    post:
      operationId: importBundledJobProviderPack
      description: Explicitly imports a discoverable source-controlled provider pack without loading manifest-supplied executable code.
      security:
        - desktopSession: []
          userAccessToken: []
      parameters:
        - name: pack_id
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9_.-]{2,159}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderPackInstallRequest" }
      responses:
        "201":
          description: The complete pack was imported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderImportResult" }
        "404": { description: The bundled provider pack does not exist or is invalid. }
        "409": { description: A provider key conflicts or the account provider limit would be exceeded; nothing was imported. }
        "422": { description: A pack provider is invalid. }
  /job-providers/validate:
    post:
      operationId: validateJobProviderConfiguration
      description: Validates declaration syntax, limits, mapping and the literal destination without network access.
      security:
        - desktopSession: []
          userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderConfigurationInput" }
      responses:
        "200":
          description: Validation result and bounded warnings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderValidation" }
        "422": { description: Declaration is invalid. }
  /job-providers/{provider_id}:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getJobProviderConfiguration
      security:
        - desktopSession: []
          userAccessToken: []
      responses:
        "200":
          description: Owned provider with confidential headers redacted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderConfiguration" }
        "404": { description: Provider is not owned or does not exist. }
    put:
      operationId: updateJobProviderConfiguration
      description: Compare-and-swap update; redaction preservation markers may retain existing confidential headers.
      security:
        - desktopSession: []
          userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderConfigurationUpdate" }
      responses:
        "200":
          description: Updated provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderConfiguration" }
        "404": { description: Provider is not owned or does not exist. }
        "409": { description: Expected revision is stale or key conflicts. }
        "422": { description: Declaration is invalid. }
    delete:
      operationId: deleteJobProviderConfiguration
      description: Deletes one owned provider at the expected revision without deleting captured jobs.
      security:
        - desktopSession: []
          userAccessToken: []
      parameters:
        - name: expected_revision
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Provider deleted. }
        "404": { description: Provider is not owned or does not exist. }
        "409": { description: Expected revision is stale. }
  /job-providers/{provider_id}/test:
    post:
      operationId: testJobProviderConfiguration
      description: Resolves the declared public HTTPS origin and performs one bounded, no-redirect request returning at most five redacted mapped jobs.
      security:
        - desktopSession: []
          userAccessToken: []
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderTestRequest" }
      responses:
        "200":
          description: Bounded provider sample.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderTestResult" }
        "404": { description: Provider is not owned or does not exist. }
        "429": { description: Provider-test rate limit exceeded. }
        "502": { description: Destination, request or response failed safely. }
        "503": { description: Offline mode disables provider network access. }
  /job-providers/{provider_id}/state:
    patch:
      operationId: setJobProviderNetworkState
      description: Compare-and-swap enable or disable of any installed provider, including an imported native adapter.
      security:
        - desktopSession: []
          userAccessToken: []
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderStateUpdate" }
      responses:
        "200":
          description: Provider network state updated at the next revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderConfiguration" }
        "404": { description: Provider is not owned or does not exist. }
        "409": { description: Expected revision is stale. }
components:
  securitySchemes:
    desktopSession:
      type: apiKey
      in: header
      name: X-CareerOS-Session
      description: Per-launch secret supplied by the native shell; disabled in explicit browser development.
    userAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authenticated local CareerOS user access token.
    refreshCookie:
      type: apiKey
      in: cookie
      name: careeros_refresh_token
      description: HttpOnly, path-scoped, single-use JWT bound to one persisted session family.
  headers:
    PrivateCacheControl:
      description: Prevents storage of account access and error responses.
      schema: { type: string, const: "no-store, max-age=0" }
    PrivatePragma:
      description: Compatibility directive for clients with legacy HTTP caches.
      schema: { type: string, const: no-cache }
    RetryAfter:
      description: Whole seconds before grant creation may retry for this account.
      schema: { type: integer, minimum: 1 }
  schemas:
    AuthToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, username]
      properties:
        access_token: { type: string, minLength: 1 }
        token_type: { const: bearer }
        username: { type: string, minLength: 1, maxLength: 50 }
        session_state:
          $ref: "#/components/schemas/VaultLifecyclePendingState"
          description: Present only when access is maintenance-purpose and no refresh token is issued.
    VaultLifecyclePendingState:
      type: string
      enum: [reset_pending, restore_pending, erasure_pending]
    HealthLive:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { const: alive }
    HealthReady:
      type: object
      additionalProperties: false
      required: [status, database, storage, migrations]
      properties:
        status: { type: string, enum: [ready, degraded, maintenance] }
        code: { type: string, enum: [vault_maintenance_pending] }
        database: { type: string, enum: [connected, unavailable, not_checked] }
        storage: { type: string, enum: [writable, unavailable, not_checked] }
        migrations: { type: string, enum: [current, outdated, unavailable, not_checked] }
    MaintenanceFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, minLength: 1, maxLength: 80 }
        message: { type: string, minLength: 1, maxLength: 500 }
    PendingDetail:
      type: object
      additionalProperties: false
      required: [code, message, session_state, reauth_required]
      properties:
        code:
          type: string
          enum: [reset_cleanup_pending, restore_cleanup_pending, erasure_cleanup_pending]
        message: { type: string, minLength: 1, maxLength: 500 }
        session_state: { $ref: "#/components/schemas/VaultLifecyclePendingState" }
        reauth_required: { type: boolean }
        maintenance_access_token:
          type: string
          minLength: 1
          description: Optional replacement recovery bearer; never persisted or refreshable.
    MaintenanceErrorResponse:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          oneOf:
            - { $ref: "#/components/schemas/PendingDetail" }
            - { $ref: "#/components/schemas/MaintenanceFailure" }
    ArchiveInspection:
      type: object
      additionalProperties: false
      required:
        - archive_sha256
        - archive_bytes
        - format_version
        - created_at
        - record_counts
        - total_records
        - file_count
        - file_bytes
        - compatible
        - restorable
        - verification_codes
        - warning_codes
      properties:
        status: { const: valid, default: valid }
        archive_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        archive_bytes: { type: integer, minimum: 1, maximum: 134217728 }
        format_version: { type: integer, minimum: 1, maximum: 6 }
        created_at: { type: string, format: date-time }
        record_counts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        total_records: { type: integer, minimum: 0 }
        file_count: { type: integer, minimum: 0 }
        file_bytes: { type: integer, minimum: 0 }
        compatible: { type: boolean }
        restorable: { type: boolean }
        verification_codes:
          type: array
          items:
            type: string
            enum:
              - manifest_verified
              - members_verified
              - records_verified
              - relationships_verified
              - file_bindings_verified
        warning_codes:
          type: array
          items:
            type: string
            enum:
              - archive_not_encrypted
              - archive_not_authenticated
              - ai_output_requires_revalidation
              - restore_requires_empty_vault
              - restore_target_conflict
    RestoreResponse:
      type: object
      additionalProperties: false
      required: [format_version, archive_sha256, restored_records, restored_files]
      properties:
        format_version: { type: integer, minimum: 1, maximum: 6 }
        archive_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        restored_records:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        restored_files: { type: integer, minimum: 0 }
    PrivateErrorResponse:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail: { type: string }
    AutomationErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - authentication_failed
            - reauthentication_locked
            - active_grant_limit
            - grant_not_found
            - invalid_label
            - invalid_scopes
            - invalid_lifetime
        message: { type: string }
    AutomationErrorResponse:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail: { $ref: "#/components/schemas/AutomationErrorDetail" }
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [type, loc, msg]
      properties:
        type: { type: string }
        loc:
          type: array
          items: { type: [string, integer] }
        msg:
          type: string
          description: A schema-authored validation message; raw request input and context are omitted.
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [detail, message]
      properties:
        detail:
          type: array
          items: { $ref: "#/components/schemas/ValidationIssue" }
        message: { const: "Validation Error" }
    AutomationScope:
      type: string
      enum:
        - system:read
        - career:read
        - career:write
        - resume:read
        - resume:write
        - jobs:read
        - jobs:write
        - search:execute
        - providers:read
        - providers:write
        - applications:read
        - applications:write
    AutomationGrant:
      type: object
      additionalProperties: false
      required: [id, label, scopes, expires_at, revoked_at, created_at]
      properties:
        id: { type: string, format: uuid }
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: A normalized printable Unicode client label without control or invisible format characters.
        scopes:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items: { $ref: "#/components/schemas/AutomationScope" }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    AutomationGrantIssue:
      type: object
      additionalProperties: false
      required: [label, scopes, password]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: A printable Unicode client label; leading and trailing whitespace are removed.
        scopes:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items: { $ref: "#/components/schemas/AutomationScope" }
        lifetime_days: { type: integer, minimum: 1, maximum: 365, default: 30 }
        password: { type: string, format: password, writeOnly: true }
    AutomationGrantIssued:
      type: object
      additionalProperties: false
      required: [grant, token, token_environment_variable, warning]
      properties:
        grant: { $ref: "#/components/schemas/AutomationGrant" }
        token:
          type: string
          minLength: 50
          maxLength: 96
          readOnly: true
          description: Returned once. CareerOS persists only its SHA-256 digest.
        token_environment_variable: { const: CAREEROS_MCP_TOKEN }
        warning:
          const: This token is shown once. Store it in your OS credential manager and never commit it.
    ProviderRequestConfiguration:
      type: object
      additionalProperties: false
      required: [base_url, path_template, method, query_params, headers, timeout_seconds, max_response_bytes, max_pages, page_size, throttle_ms, retries]
      properties:
        base_url: { type: string, format: uri, minLength: 12, maxLength: 2048, description: Credential-free public HTTPS origin on port 443. }
        path_template: { type: string, minLength: 1, maxLength: 1024 }
        method: { type: string, enum: [GET, POST] }
        query_params:
          type: object
          maxProperties: 30
          additionalProperties: { type: string, maxLength: 2000 }
        json_body: { type: [object, "null"] }
        headers:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 2048, writeOnly: true }
          description: Every value is confidential, redacted after write and omitted from portable archives.
        timeout_seconds: { type: number, minimum: 1, maximum: 60, default: 20 }
        max_response_bytes: { type: integer, minimum: 1024, maximum: 8388608, default: 2000000 }
        max_pages: { type: integer, minimum: 1, maximum: 20, default: 5 }
        page_size: { type: integer, minimum: 1, maximum: 100, default: 50 }
        throttle_ms: { type: integer, minimum: 0, maximum: 10000, default: 250 }
        retries: { type: integer, minimum: 0, maximum: 3, default: 1 }
    ProviderFieldMapping:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: { type: string, minLength: 1, maxLength: 500 }
        attribute: { type: [string, "null"], maxLength: 80 }
        default: { type: [string, "null"], maxLength: 1000 }
    ProviderExtractionConfiguration:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        items_path: { type: [string, "null"], maxLength: 500 }
        item_selector: { type: [string, "null"], maxLength: 500 }
        total_path: { type: [string, "null"], maxLength: 500 }
        fields:
          type: object
          minProperties: 2
          maxProperties: 20
          additionalProperties: { $ref: "#/components/schemas/ProviderFieldMapping" }
          description: Canonical mappings must include id and title.
    ProviderCapabilitiesConfiguration:
      type: object
      additionalProperties: false
      required: [accepted_domains, supported_languages]
      properties:
        accepted_domains:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 32 }
        supported_languages:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 32 }
    ProviderConfigurationInput:
      type: object
      additionalProperties: false
      required: [key, display_name, description, adapter_kind, enabled, request, extraction, capabilities]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_-]{1,63}$" }
        display_name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        adapter_kind: { type: string, enum: [json, html] }
        enabled: { type: boolean, default: false }
        request: { $ref: "#/components/schemas/ProviderRequestConfiguration" }
        extraction: { $ref: "#/components/schemas/ProviderExtractionConfiguration" }
        capabilities: { $ref: "#/components/schemas/ProviderCapabilitiesConfiguration" }
    ProviderConfigurationUpdate:
      allOf:
        - { $ref: "#/components/schemas/ProviderConfigurationInput" }
        - type: object
          required: [expected_revision]
          properties:
            expected_revision: { type: integer, minimum: 1 }
    ProviderConfiguration:
      type: object
      additionalProperties: false
      required: [id, key, display_name, description, adapter_kind, enabled, revision, native_adapter_id, source_pack_id, source_pack_version, request, extraction, capabilities, has_secrets, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, pattern: "^[a-z][a-z0-9_-]{1,63}$" }
        display_name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        adapter_kind: { type: string, enum: [json, html, native] }
        enabled: { type: boolean }
        revision: { type: integer, minimum: 1 }
        native_adapter_id: { type: [string, "null"], maxLength: 64 }
        source_pack_id: { type: [string, "null"], maxLength: 160 }
        source_pack_version: { type: [string, "null"], maxLength: 64 }
        request:
          oneOf:
            - { $ref: "#/components/schemas/ProviderRequestConfiguration" }
            - { type: "null" }
        extraction:
          oneOf:
            - { $ref: "#/components/schemas/ProviderExtractionConfiguration" }
            - { type: "null" }
        capabilities: { $ref: "#/components/schemas/ProviderCapabilitiesConfiguration" }
        has_secrets: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeclarativeProviderImportEntry:
      type: object
      additionalProperties: false
      required: [kind, configuration]
      properties:
        kind: { const: declarative }
        configuration: { $ref: "#/components/schemas/ProviderConfigurationInput" }
      description: The configuration must be disabled and contain no headers.
    NativeProviderImportEntry:
      type: object
      additionalProperties: false
      required: [kind, adapter_id, key, display_name, description, capabilities]
      properties:
        kind: { const: native }
        adapter_id: { type: string, pattern: "^[a-z][a-z0-9_-]{1,63}$" }
        key: { type: string, pattern: "^[a-z][a-z0-9_-]{1,63}$" }
        display_name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        capabilities: { $ref: "#/components/schemas/ProviderCapabilitiesConfiguration" }
      description: adapter_id and key must match a closed, reviewed adapter identifier; module and executable paths are not accepted.
    ProviderImportEntry:
      oneOf:
        - { $ref: "#/components/schemas/DeclarativeProviderImportEntry" }
        - { $ref: "#/components/schemas/NativeProviderImportEntry" }
      discriminator:
        propertyName: kind
    ProviderDocument:
      type: object
      additionalProperties: false
      required: [kind, format_version, provider]
      properties:
        kind: { const: provider }
        format_version: { const: 1 }
        provider: { $ref: "#/components/schemas/ProviderImportEntry" }
    ProviderPackDocument:
      type: object
      additionalProperties: false
      required: [kind, format_version, id, version, name, description, providers]
      properties:
        kind: { const: provider_pack }
        format_version: { const: 1 }
        id: { type: string, pattern: "^[a-z][a-z0-9_.-]{2,159}$" }
        version: { type: string, minLength: 5, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        providers:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ProviderImportEntry" }
    ProviderImportDocument:
      oneOf:
        - { $ref: "#/components/schemas/ProviderDocument" }
        - { $ref: "#/components/schemas/ProviderPackDocument" }
      discriminator:
        propertyName: kind
    ProviderImportRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document: { $ref: "#/components/schemas/ProviderImportDocument" }
        activate: { type: boolean, default: false }
    ProviderPackInstallRequest:
      type: object
      additionalProperties: false
      properties:
        activate: { type: boolean, default: false }
    ProviderStateUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, enabled]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        enabled: { type: boolean }
    ProviderPackSummary:
      type: object
      additionalProperties: false
      required: [id, version, name, description, provider_keys]
      properties:
        id: { type: string }
        version: { type: string }
        name: { type: string }
        description: { type: string }
        provider_keys:
          type: array
          maxItems: 20
          items: { type: string }
    ProviderImportResult:
      type: object
      additionalProperties: false
      required: [source_id, activated, imported]
      properties:
        source_id: { type: [string, "null"] }
        activated: { type: boolean }
        imported:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ProviderConfiguration" }
    ProviderCatalog:
      type: object
      additionalProperties: false
      required: [installed, available_packs]
      properties:
        installed:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ProviderConfiguration" }
        available_packs:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ProviderPackSummary" }
    ProviderValidation:
      type: object
      additionalProperties: false
      required: [valid, provider_key, warnings]
      properties:
        valid: { const: true }
        provider_key: { type: string }
        warnings: { type: array, maxItems: 20, items: { type: string } }
    ProviderTestRequest:
      type: object
      additionalProperties: false
      properties:
        query: { type: string, maxLength: 1000, default: software engineer }
        location: { type: string, maxLength: 500, default: "" }
        language: { type: string, minLength: 2, maxLength: 16, default: en }
    ProviderTestResult:
      type: object
      additionalProperties: false
      required: [provider_key, returned_count, sample, diagnostics]
      properties:
        provider_key: { type: string }
        returned_count: { type: integer, minimum: 0, maximum: 5 }
        sample:
          type: array
          maxItems: 5
          items: { type: object }
        diagnostics: { type: array, maxItems: 20, items: { type: string } }
    LocalModelStatus:
      type: object
      additionalProperties: false
      required:
        - runtimeMode
        - runtimeState
        - ready
        - configuredModel
        - installState
        - downloadedBytes
        - totalBytes
        - canInstall
        - canCancel
      properties:
        runtimeMode: { type: string, enum: [managed_llama_cpp, ollama] }
        runtimeState: { type: string, enum: [unavailable, stopped, starting, ready, failed] }
        ready: { type: boolean }
        configuredModel: { type: string }
        installedModels: { type: array, items: { type: string } }
        installState:
          type: string
          enum: [absent, checking_space, downloading_runtime, verifying_runtime, downloading_model, verifying_model, installing, ready, cancelling, failed]
        downloadedBytes: { type: integer, minimum: 0 }
        totalBytes: { type: integer, minimum: 0 }
        errorCode: { type: [string, "null"] }
        canInstall: { type: boolean }
        canCancel: { type: boolean }
        catalogVersion: { type: string }
        modelLicense: { type: [string, "null"] }
    LocalModelReadiness:
      type: object
      additionalProperties: false
      required: [required, ready, runtime, configured_model, privacy_boundary, checks]
      properties:
        required: { const: true }
        ready: { type: boolean }
        runtime: { type: string, enum: [llama.cpp, ollama] }
        configured_model: { type: string }
        model_id: { type: [string, "null"] }
        privacy_boundary: { const: local-only }
        error_code: { type: [string, "null"] }
        checks:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [code, status]
            properties:
              code:
                type: string
                enum: [endpoint_allowed, runtime_reachable, model_available, structured_output]
              status: { type: string, enum: [passed, failed] }
    ModelCatalogEntry:
      type: object
      additionalProperties: false
      required: [key, displayName, author, license, parameters, quantization, sizeBytes, minimumRamBytes, recommendedRamBytes]
      properties:
        key: { type: string }
        displayName: { type: string }
        author: { type: string }
        license: { type: string }
        parameters: { type: string }
        quantization: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        minimumRamBytes: { type: integer, minimum: 1 }
        recommendedRamBytes: { type: integer, minimum: 1 }
        contextTokens: { type: integer, minimum: 1024 }
    ApplicationAgendaResponse:
      type: object
      additionalProperties: false
      required: [generated_at, local_day_end, horizon_end, active_count, visible_count, later_count, truncated_count, items]
      properties:
        generated_at: { type: string, format: date-time }
        local_day_end: { type: string, format: date-time }
        horizon_end: { type: string, format: date-time }
        active_count: { type: integer, minimum: 0 }
        visible_count: { type: integer, minimum: 0 }
        later_count: { type: integer, minimum: 0 }
        truncated_count: { type: integer, minimum: 0 }
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/ApplicationAgendaItem" }
    ApplicationAgendaItem:
      type: object
      additionalProperties: false
      required: [application_id, application_revision, title, company, current_stage, latest_event_at, state, next_action]
      properties:
        application_id: { type: string, format: uuid }
        application_revision: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 240 }
        company: { type: string, minLength: 1, maxLength: 240 }
        current_stage:
          type: string
          enum: [saved, preparing, applied, screening, interview, offer, accepted]
        latest_event_at: { type: string, format: date-time }
        state:
          type: string
          enum: [overdue, today, upcoming, unscheduled, needs_action]
        next_action:
          oneOf:
            - { $ref: "#/components/schemas/ApplicationNextAction" }
            - { type: "null" }
    ApplicationNextAction:
      type: object
      additionalProperties: false
      required: [id, title, due_at, priority]
      properties:
        id: { type: string, minLength: 1, maxLength: 36 }
        title: { type: string, minLength: 1, maxLength: 500 }
        due_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        priority: { type: string, enum: [low, normal, high, urgent] }
    ApplicationPreparationUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision]
      anyOf:
        - required: [title]
        - required: [company]
        - required: [description]
        - required: [application_url]
        - required: [application_email]
        - required: [resume_version_id]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        title: { type: [string, "null"], maxLength: 240 }
        company: { type: [string, "null"], maxLength: 240 }
        description: { type: [string, "null"], maxLength: 100000 }
        application_url: { type: [string, "null"], maxLength: 2048 }
        application_email: { type: [string, "null"], maxLength: 320 }
        resume_version_id: { type: [string, "null"], maxLength: 36 }
    DossierDraftAnswer:
      type: object
      additionalProperties: false
      required: [client_id]
      properties:
        client_id: { type: string, minLength: 1, maxLength: 100 }
        question: { type: string, maxLength: 1000, default: "" }
        answer: { type: string, maxLength: 20000, default: "" }
    DossierDraftChecklistItem:
      type: object
      additionalProperties: false
      required: [client_id]
      properties:
        client_id: { type: string, minLength: 1, maxLength: 100 }
        label: { type: string, maxLength: 500, default: "" }
        completed: { type: boolean, default: false }
    DossierDraftRequirementEvidence:
      type: object
      additionalProperties: false
      required: [client_id]
      properties:
        client_id: { type: string, minLength: 1, maxLength: 100 }
        requirement: { type: string, maxLength: 2000, default: "" }
        evidence_fact_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
    ApplicationDossierDraftContent:
      type: object
      additionalProperties: false
      required: [requirement_matrix]
      description: Incomplete draft rows are allowed; client_id values are unique per collection.
      properties:
        cover_letter: { type: [string, "null"], maxLength: 30000 }
        answers:
          type: array
          maxItems: 25
          items: { $ref: "#/components/schemas/DossierDraftAnswer" }
        checklist:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/DossierDraftChecklistItem" }
        requirement_matrix:
          type: array
          minItems: 1
          maxItems: 25
          items: { $ref: "#/components/schemas/DossierDraftRequirementEvidence" }
    ApplicationDossierDraftPut:
      type: object
      additionalProperties: false
      required:
        - expected_application_revision
        - resume_version_id
        - content
      properties:
        expected_revision: { type: [integer, "null"], minimum: 1 }
        expected_application_revision: { type: integer, minimum: 1 }
        resume_version_id: { type: string, format: uuid }
        content: { $ref: "#/components/schemas/ApplicationDossierDraftContent" }
    ApplicationDossierDraftResponse:
      type: object
      additionalProperties: false
      required:
        - application_id
        - resume_version_id
        - application_revision
        - revision
        - content
        - created_at
        - updated_at
      properties:
        application_id: { type: string, format: uuid }
        resume_version_id: { type: string, format: uuid }
        application_revision: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 1 }
        content: { $ref: "#/components/schemas/ApplicationDossierDraftContent" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DossierAnswer:
      type: object
      additionalProperties: false
      required: [question, answer]
      properties:
        question: { type: string, minLength: 1, maxLength: 1000 }
        answer: { type: string, minLength: 1, maxLength: 20000 }
    DossierChecklistItem:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 500 }
        completed: { type: boolean, default: false }
    DossierRequirementEvidence:
      type: object
      additionalProperties: false
      required: [requirement, evidence_fact_ids]
      properties:
        requirement: { type: string, minLength: 1, maxLength: 2000 }
        evidence_fact_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
    ApplicationDossierCreate:
      type: object
      additionalProperties: false
      required: [expected_revision, requirement_matrix]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        expected_draft_revision: { type: [integer, "null"], minimum: 1 }
        cover_letter: { type: [string, "null"], maxLength: 30000 }
        answers:
          type: array
          maxItems: 25
          items: { $ref: "#/components/schemas/DossierAnswer" }
        checklist:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/DossierChecklistItem" }
        requirement_matrix:
          type: array
          minItems: 1
          maxItems: 25
          items: { $ref: "#/components/schemas/DossierRequirementEvidence" }
    ApplicationReadinessReport:
      type: object
      additionalProperties: false
      required: [schema_version, application_id, application_revision, role_title, company, status, score_kind, completeness_score, blocker_count, warning_count, checks, fingerprint]
      properties:
        schema_version: { const: "1.0" }
        application_id: { type: string, format: uuid }
        application_revision: { type: integer, minimum: 1 }
        role_title: { type: string }
        company: { type: string }
        status: { type: string, enum: [ready, action_needed, blocked] }
        score_kind: { const: preflight_completeness }
        completeness_score: { type: integer, minimum: 0, maximum: 100 }
        blocker_count: { type: integer, minimum: 0 }
        warning_count: { type: integer, minimum: 0 }
        checks:
          type: array
          items: { $ref: "#/components/schemas/ApplicationReadinessCheck" }
        fingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
    ApplicationReadinessCheck:
      type: object
      additionalProperties: false
      required: [id, status, points_awarded, points_available, evidence]
      properties:
        id: { type: string }
        status: { type: string, enum: [pass, warning, blocker] }
        points_awarded: { type: integer, minimum: 0, maximum: 100 }
        points_available: { type: integer, minimum: 1, maximum: 100 }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/ReadinessEvidence" }
        action: { type: [string, "null"] }
    ReadinessEvidence:
      type: object
      additionalProperties: false
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: string }
