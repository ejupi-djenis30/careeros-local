name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      expected_tag:
        description: Optional stable tag to validate during the read-only rehearsal
        required: false
        type: string
  pull_request:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref_type == 'tag' && 'tag-publication' || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Read-only baseline for build, smoke, and assembly jobs. The tag-only
# publication job declares its narrowly scoped write permissions separately.
permissions:
  contents: read # Required to check out and inspect the release source.

env:
  PYTHON_VERSION: "3.12.13"
  NODE_VERSION: "24.18.0"
  RUST_VERSION: "1.96.0"
  OPENSSL_SOURCE_VERSION: "3.6.3"
  RELEASE_DATE: "2026-07-30"
  RELEASE_COMMIT: ${{ github.sha }}
  RELEASE_REPOSITORY: ${{ github.repository }}
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  supply-chain:
    name: Release supply-chain evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      native-matrix: ${{ steps.native-matrix.outputs.matrix }}
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select native package targets
        id: native-matrix
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          matrix = json.loads(Path(".github/native-targets.json").read_text(encoding="utf-8"))
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              matrix["include"] = [target for target in matrix["include"] if target["pullRequest"]]
          for target in matrix["include"]:
              target.pop("pullRequest")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
          PY
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Enforce read-only dispatch and stable release metadata
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.expected_tag || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual release rehearsals must run from main" >&2
            exit 1
          fi
          arguments=()
          if [[ -n "$EXPECTED_TAG" ]]; then
            arguments+=(--expected-tag "$EXPECTED_TAG")
          fi
          python -m scripts.check_release_versions \
            --expected-release-date "$RELEASE_DATE" \
            "${arguments[@]}"
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install locked audit dependencies
        run: |
          python -m pip install --require-hashes --requirement requirements-dev.lock
          npm ci --prefix frontend --ignore-scripts
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo metadata --manifest-path frontend/src-tauri/Cargo.toml --locked --format-version 1 |
            python -c "import json, sys; json.load(sys.stdin)"
      - name: Verify approved third-party notices
        run: python -m scripts.third_party_notices --verify
      - name: Smoke-test locked packaging tools in isolation
        run: |
          tooling_venv="$RUNNER_TEMP/careeros-tooling"
          python -m venv "$tooling_venv"
          "$tooling_venv/bin/python" -m pip install \
            --require-hashes --requirement requirements-tooling.lock
          "$tooling_venv/bin/python" -m PyInstaller --version
          "$tooling_venv/bin/pip-compile" --version
          "$tooling_venv/bin/python" -m pip check
      - name: Audit Python and create exact evidence
        run: |
          mkdir -p "$RUNNER_TEMP/careeros-evidence"
          python -m pip_audit --disable-pip --require-hashes --requirement requirements.lock \
            --format json --output "$RUNNER_TEMP/careeros-evidence/python-production-audit.json"
          python -m pip_audit --disable-pip --require-hashes --requirement requirements-dev.lock \
            --format json --output "$RUNNER_TEMP/careeros-evidence/python-dev-audit.json"
          python -m pip_audit --disable-pip --require-hashes --requirement requirements-tooling.lock \
            --format json --output "$RUNNER_TEMP/careeros-evidence/python-tooling-audit.json"
          python -m pip_audit --disable-pip --require-hashes --requirement requirements.lock \
            --format cyclonedx-json --output "$RUNNER_TEMP/careeros-evidence/backend-sbom.cdx.json"
          python -m scripts.finalize_backend_sbom \
            --sbom "$RUNNER_TEMP/careeros-evidence/backend-sbom.cdx.json" \
            --requirements-lock requirements.lock
          pip-licenses --from=mixed --format=json \
            --output-file "$RUNNER_TEMP/careeros-evidence/backend-licenses.json" \
            --fail-on "GNU General Public License;GNU Affero General Public License;AGPL-1.0;AGPL-3.0;Server Side Public License;SSPL-1.0;Business Source License;BUSL-1.1" \
            --partial-match
      - name: Audit npm and create exact evidence
        working-directory: frontend
        run: |
          set +e
          npm audit --audit-level=high --json \
            > "$RUNNER_TEMP/careeros-evidence/frontend-audit.json"
          audit_status=$?
          set -e
          cp ../frontend-security-exceptions.json \
            "$RUNNER_TEMP/careeros-evidence/frontend-security-exceptions.json"
          python3 ../scripts/check_frontend_security_exceptions.py \
            --audit "$RUNNER_TEMP/careeros-evidence/frontend-audit.json" \
            --npm-audit-exit-code "$audit_status"
          npm sbom --sbom-format cyclonedx \
            > "$RUNNER_TEMP/careeros-evidence/frontend-sbom.cdx.json"
          node ../scripts/audit_frontend_licenses.mjs \
            --output "$RUNNER_TEMP/careeros-evidence/frontend-licenses.json"
      - name: Audit Cargo and create exact evidence
        working-directory: frontend/src-tauri
        run: |
          cp ../../security-exceptions.json \
            "$RUNNER_TEMP/careeros-evidence/security-exceptions.json"
          python3 ../../scripts/check_security_exceptions.py
          cargo audit --deny unsound --ignore RUSTSEC-2024-0429 --json \
            > "$RUNNER_TEMP/careeros-evidence/rust-audit.json"
          python3 -m json.tool "$RUNNER_TEMP/careeros-evidence/rust-audit.json" > /dev/null
          cargo deny --all-features check licenses
          cargo cyclonedx --all-features --target all --format json \
            --spec-version 1.5 --override-filename rust-sbom
          mv rust-sbom.json "$RUNNER_TEMP/careeros-evidence/rust-sbom.cdx.json"
          cargo deny --all-features list --format json \
            > "$RUNNER_TEMP/careeros-evidence/rust-licenses.json"
          cargo tree --locked --target all -i glib@0.18.5 \
            > "$RUNNER_TEMP/careeros-evidence/cargo-exception-tree.txt"
      - name: Validate exact evidence contract
        run: python -c "from pathlib import Path; from scripts.release_contract import validate_evidence_directory; validate_evidence_directory(Path('$RUNNER_TEMP/careeros-evidence'))"
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-supply-chain
          path: ${{ runner.temp }}/careeros-evidence
          if-no-files-found: error
          retention-days: 14

  agent-build:
    name: Build Agent Access release candidate
    needs: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      wheel-name: ${{ steps.agent-metadata.outputs.wheel-name }}
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked wheel build tools
        run: python -m pip install --require-hashes --requirement requirements-tooling.lock
      - name: Build the Agent Access wheel once
        shell: bash
        run: |
          # Dereference annotated tags so one source commit always yields one wheel.
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}^{commit}")"
          if [[ ! "$source_date_epoch" =~ ^[0-9]+$ ]] || (( source_date_epoch < 315532800 )); then
            echo "::error::Invalid commit timestamp for SOURCE_DATE_EPOCH: $source_date_epoch"
            exit 1
          fi
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          mkdir -p agent-wheel
          python -m pip wheel \
            --no-build-isolation \
            --no-deps \
            --wheel-dir agent-wheel \
            .
      - name: Stage and validate the exact Agent Access candidate
        run: >-
          python -m scripts.release_candidate stage-agent
          --wheel-root agent-wheel
          --requirements-lock requirements.lock
          --output agent-candidate
          --commit "$RELEASE_COMMIT"
      - name: Read exact Agent Access wheel name
        id: agent-metadata
        shell: bash
        run: |
          wheel_name="$(python -c 'from scripts.agent_distribution import canonical_agent_wheel_name; from scripts.check_release_versions import release_versions, validate_versions; print(canonical_agent_wheel_name(validate_versions(release_versions())))')"
          test -f "agent-candidate/$wheel_name"
          echo "wheel-name=$wheel_name" >> "$GITHUB_OUTPUT"
      - name: Upload build-once Agent Access candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-release-candidate
          path: agent-candidate/*
          if-no-files-found: error
          retention-days: 14

  agent-smoke:
    name: Agent Access · ${{ matrix.label }}
    needs: agent-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux · Python 3.12
            runner: ubuntu-24.04
            python: "3.12"
          - label: Windows · Python 3.12
            runner: windows-2025
            python: "3.12"
          - label: macOS · Python 3.12
            runner: macos-15
            python: "3.12"
          - label: Linux · Python 3.13
            runner: ubuntu-24.04
            python: "3.13"
          - label: Windows · Python 3.13
            runner: windows-2025
            python: "3.13"
          - label: macOS · Python 3.13
            runner: macos-15
            python: "3.13"
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Download the build-once Agent Access candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-release-candidate
          path: agent-candidate
      - name: Smoke the exact release wheel and lock
        shell: bash
        env:
          AGENT_WHEEL_NAME: ${{ needs.agent-build.outputs.wheel-name }}
        run: >-
          python scripts/smoke_agent_wheel.py
          --wheel "agent-candidate/$AGENT_WHEEL_NAME"
          --requirements-lock agent-candidate/requirements.lock

  native:
    name: ${{ matrix.label }}
    needs: supply-chain
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.supply-chain.outputs.native-matrix) }}
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin native build timestamp to the source commit
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "${RELEASE_COMMIT}^{commit}")"
          if [[ ! "$source_date_epoch" =~ ^[0-9]+$ ]] || (( source_date_epoch < 315532800 )); then
            echo "::error::Invalid commit timestamp for SOURCE_DATE_EPOCH: $source_date_epoch"
            exit 1
          fi
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install exact Rust target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb
      - name: Configure OpenSSL for source-built macOS Intel wheels
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          open_ssl_root="$(brew --prefix openssl@3)"
          installed_version="$(brew list --versions openssl@3 | awk '{print $2}')"
          if [[ "$installed_version" != "$OPENSSL_SOURCE_VERSION" ]]; then
            echo "Expected OpenSSL $OPENSSL_SOURCE_VERSION, found $installed_version" >&2
            exit 1
          fi
          for required_file in \
            "$open_ssl_root/include/openssl/ssl.h" \
            "$open_ssl_root/lib/libcrypto.a" \
            "$open_ssl_root/lib/libssl.a"; do
            if [[ ! -f "$required_file" ]]; then
              echo "Required macOS Intel OpenSSL file is missing: $required_file" >&2
              exit 1
            fi
          done
          {
            echo "OPENSSL_DIR=$open_ssl_root"
            echo "OPENSSL_STATIC=1"
            echo "PIP_NO_CACHE_DIR=1"
          } >> "$GITHUB_ENV"
      - name: Configure OpenSSL for source-built Windows ARM64 wheels
        if: runner.os == 'Windows' && matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $openSslRoot = Join-Path $env:ProgramFiles "OpenSSL"
          $openSslExecutable = Join-Path $openSslRoot "bin\openssl.exe"
          $openSslInclude = Join-Path $openSslRoot "include"
          $openSslStaticLibraryRoot = Join-Path $openSslRoot "lib\VC\arm64\MD"
          $staticLibraryDirectory = Join-Path $env:RUNNER_TEMP "careeros-openssl-static"
          $staticLibraries = [ordered]@{
            "libcrypto.lib" = Join-Path $openSslStaticLibraryRoot "libcrypto_static.lib"
            "libssl.lib" = Join-Path $openSslStaticLibraryRoot "libssl_static.lib"
          }
          $requiredFiles = @(
            $openSslExecutable
            (Join-Path $openSslInclude "openssl\ssl.h")
          ) + @($staticLibraries.Values)
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Required Windows ARM64 OpenSSL file is missing: $requiredFile"
            }
          }
          $installedVersion = (& $openSslExecutable version).Split(" ")[1]
          if ($installedVersion -ne $env:OPENSSL_SOURCE_VERSION) {
            throw "Expected OpenSSL $env:OPENSSL_SOURCE_VERSION, found $installedVersion"
          }
          New-Item -ItemType Directory -Path $staticLibraryDirectory -Force | Out-Null
          foreach ($library in $staticLibraries.GetEnumerator()) {
            Copy-Item -LiteralPath $library.Value `
              -Destination (Join-Path $staticLibraryDirectory $library.Key)
          }
          "OPENSSL_INCLUDE_DIR=$openSslInclude" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$staticLibraryDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PIP_NO_CACHE_DIR=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install locked Python production dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install locked Python packaging dependencies
        run: python -m pip install --require-hashes -r requirements-tooling.lock
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Verify locked Rust dependency graph
        run: >-
          cargo metadata --manifest-path frontend/src-tauri/Cargo.toml
          --locked --format-version 1
          | python -c "import json, sys; json.load(sys.stdin)"
      - name: Reproduce approved third-party notices on Windows
        if: runner.os == 'Windows'
        run: python -m scripts.third_party_notices --check
      - name: Freeze and smoke-test local backend
        run: python scripts/build_backend_sidecar.py
      - name: Verify native sidecar architecture
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: python -m scripts.verify_sidecar_build
      - name: Exercise packaged backend lifecycle
        run: python -m pytest tests/desktop/test_packaged_lifecycle.py -q
      - name: Build native installers from Cargo.lock
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: frontend
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Exercise Windows MSI and NSIS lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: ./scripts/smoke_windows_installer.ps1 -Target $env:NATIVE_TARGET -IncludeNsisInstall
      - name: Exercise macOS and Linux native packages
        if: runner.os != 'Windows'
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: python -m scripts.smoke_native_bundle --target "$NATIVE_TARGET"
      - name: Stage canonical target candidate
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: >-
          python -m scripts.release_candidate stage
          --target "$NATIVE_TARGET"
          --bundle-root "frontend/src-tauri/target/$NATIVE_TARGET/release/bundle"
          --output "release-candidate/$NATIVE_TARGET"
          --commit "$RELEASE_COMMIT"
      - name: Upload smoke-tested target candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: release-candidate/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  assemble-release:
    name: Assemble verified release assets
    if: github.event_name != 'pull_request'
    needs: [supply-chain, agent-build, agent-smoke, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked release validation dependencies
        run: python -m pip install --require-hashes --requirement requirements-tooling.lock
      - name: Download isolated native candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: release-staging/native
      - name: Download supply-chain evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-supply-chain
          path: release-staging/evidence
      - name: Download smoke-tested Agent Access candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-release-candidate
          path: release-staging/agent
      - name: Assemble and reverify exact release contract
        env:
          EXPECTED_RELEASE_DATE: ${{ env.RELEASE_DATE }}
        run: >-
          python -m scripts.release_candidate assemble
          --native-root release-staging/native
          --agent-root release-staging/agent
          --evidence-root release-staging/evidence
          --output release-assets
          --native-checksums release-attestation/native-subjects.sha256
          --agent-checksums release-attestation/agent-subjects.sha256
          --commit "$RELEASE_COMMIT"
          --release-date "$EXPECTED_RELEASE_DATE"
      - name: Upload exact release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload native SBOM subjects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-subject-checksums
          path: release-attestation/native-subjects.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload Agent Access SBOM subject
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-subject-checksums
          path: release-attestation/agent-subjects.sha256
          if-no-files-found: error
          retention-days: 14

  attest-publish:
    name: Attest and publish verified desktop release
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    needs: assemble-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      artifact-metadata: write # Required to persist GitHub artifact attestations.
      attestations: write # Required by actions/attest for provenance and SBOMs.
      contents: write # Required only for the final immutable GitHub release.
      id-token: write # Required for keyless Sigstore identity in actions/attest.
    steps:
      - name: Check out tagged source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-assets
          path: release-assets
      - name: Download native SBOM subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-subject-checksums
          path: release-attestation
      - name: Download Agent Access SBOM subject
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-subject-checksums
          path: release-attestation
      - name: Verify source policy before any mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.verify_release_source
          --repo "$RELEASE_REPOSITORY"
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_COMMIT"
      - name: Install hash-locked release validation dependencies
        run: python -m pip install --require-hashes --requirement requirements-tooling.lock
      - name: Reverify exact candidate bytes
        env:
          EXPECTED_RELEASE_DATE: ${{ env.RELEASE_DATE }}
        run: >-
          python -m scripts.release_candidate verify
          --directory release-assets
          --commit "$RELEASE_COMMIT"
          --release-date "$EXPECTED_RELEASE_DATE"
          --expected-tag "$RELEASE_TAG"
      - name: Read coordinated release version
        id: release-version
        shell: bash
        run: |
          version="$(python -c 'from scripts.check_release_versions import release_versions, validate_versions; print(validate_versions(release_versions()))')"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Install checksummed GitHub CLI
        shell: bash
        env:
          GH_CLI_VERSION: "2.94.0"
          GH_CLI_SHA256: "a757f1ba6db18f4de8cbadb244843a5f89bc75b5e7c6fc127d2bd77fbd12ed62"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$GH_CLI_SHA256  $archive" | sha256sum --check --strict
          tar -C "$RUNNER_TEMP" -xzf "$archive"
          sudo install "$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
          test "$(gh version | head -n 1)" = "gh version $GH_CLI_VERSION (2026-06-10)"
      - name: Attest all public release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: release-assets/SHA256SUMS
      - name: Attest the global checksum inventory
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/SHA256SUMS
      - name: Bind backend SBOM to every native package
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: release-attestation/native-subjects.sha256
          sbom-path: release-assets/careeros-backend-${{ steps.release-version.outputs.value }}.cdx.json
      - name: Bind frontend SBOM to every native package
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: release-attestation/native-subjects.sha256
          sbom-path: release-assets/careeros-frontend-${{ steps.release-version.outputs.value }}.cdx.json
      - name: Bind Rust SBOM to every native package
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: release-attestation/native-subjects.sha256
          sbom-path: release-assets/careeros-rust-${{ steps.release-version.outputs.value }}.cdx.json
      - name: Bind backend SBOM to the Agent Access wheel
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: release-attestation/agent-subjects.sha256
          sbom-path: release-assets/careeros-backend-${{ steps.release-version.outputs.value }}.cdx.json
      - name: Verify provenance and SBOM attestations before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/desktop-release.yml
          RELEASE_VERSION: ${{ steps.release-version.outputs.value }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' asset; do
            gh attestation verify "$asset" --repo "$GH_REPO" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --deny-self-hosted-runners
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          mkdir -p "$RUNNER_TEMP/careeros-sbom-verification"
          while read -r _digest name; do
            gh attestation verify "release-assets/$name" --repo "$GH_REPO" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
              --predicate-type "https://cyclonedx.org/bom" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --deny-self-hosted-runners --format json \
              > "$RUNNER_TEMP/careeros-sbom-verification/$name.json"
            python -m scripts.verify_sbom_attestations \
              --verification-json "$RUNNER_TEMP/careeros-sbom-verification/$name.json" \
              --sbom "release-assets/careeros-backend-${RELEASE_VERSION}.cdx.json" \
              --sbom "release-assets/careeros-frontend-${RELEASE_VERSION}.cdx.json" \
              --sbom "release-assets/careeros-rust-${RELEASE_VERSION}.cdx.json"
          done < release-attestation/native-subjects.sha256
          while read -r _digest name; do
            gh attestation verify "release-assets/$name" --repo "$GH_REPO" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
              --predicate-type "https://cyclonedx.org/bom" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --deny-self-hosted-runners --format json \
              > "$RUNNER_TEMP/careeros-sbom-verification/$name.json"
            python -m scripts.verify_sbom_attestations \
              --verification-json "$RUNNER_TEMP/careeros-sbom-verification/$name.json" \
              --sbom "release-assets/careeros-backend-${RELEASE_VERSION}.cdx.json"
          done < release-attestation/agent-subjects.sha256
      - name: Publish through the durable release contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_DATE: ${{ env.RELEASE_DATE }}
        run: >-
          python -m scripts.publish_github_release
          --directory release-assets
          --repo "$RELEASE_REPOSITORY"
          --commit "$RELEASE_COMMIT"
          --release-date "$EXPECTED_RELEASE_DATE"
